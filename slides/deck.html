<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  :root{
    --bg:#0A0A0A; --white:#fff; --grey:#B9B9B9;
    --gold:#C9A97E; --green:#3E9079; --green-deep:#1B4A47; --line:#262626;
  }
  html,body{width:100vw;height:100vh;overflow:hidden;background:var(--bg);font-family:'Poppins',sans-serif;-webkit-font-smoothing:antialiased}
  body{display:flex;align-items:center;justify-content:center}
  #root{width:1920px;height:1080px;flex:0 0 auto;transform-origin:center center}
  .slide{
    position:relative;width:1920px;height:1080px;overflow:hidden;
    display:none;flex-direction:column;justify-content:center;
    padding:120px 150px;color:var(--white);
  }
  .slide.show{display:flex}
  /* glow décoratif */
  .slide::after{content:"";position:absolute;width:900px;height:900px;border-radius:50%;
    background:radial-gradient(circle,rgba(30,74,71,.55),transparent 70%);
    top:-300px;right:-250px;pointer-events:none;}
  .slide.center{align-items:center;text-align:center}

  .kicker{color:var(--gold);font-size:26px;font-weight:700;letter-spacing:7px;text-transform:uppercase;margin-bottom:34px;position:relative;z-index:2}
  .kicker::before{content:"";display:inline-block;width:46px;height:3px;background:var(--gold);vertical-align:middle;margin-right:20px;margin-bottom:6px}
  .center .kicker::before{display:none}

  h1{font-weight:800;font-size:90px;line-height:1.04;letter-spacing:-1.5px;position:relative;z-index:2;max-width:1500px}
  .center h1{font-size:104px;max-width:1500px}
  .slide.sm h1{font-size:62px;line-height:1.14}
  h1 .g{color:var(--gold)} h1 .v{color:var(--green)}

  .sub{color:var(--grey);font-size:40px;line-height:1.42;margin-top:40px;max-width:1380px;font-weight:400;position:relative;z-index:2}
  .center .sub{margin-left:auto;margin-right:auto}

  ul{list-style:none;margin-top:48px;position:relative;z-index:2;max-width:1500px}
  li{display:flex;align-items:flex-start;gap:26px;font-size:42px;font-weight:500;line-height:1.32;color:#ededed;padding:18px 0}
  li .dot{flex:0 0 auto;width:34px;height:34px;border-radius:50%;background:var(--green-deep);box-shadow:inset 0 0 0 3px var(--gold);margin-top:10px}
  li b{color:var(--gold);font-weight:700}
  li .v{color:var(--green);font-weight:700}

  .pair{display:flex;gap:40px;margin-top:54px;position:relative;z-index:2}
  .pcard{flex:1;background:#141414;border:1px solid var(--line);border-radius:24px;padding:46px 44px}
  .pcard .num{color:var(--gold);font-size:64px;font-weight:900;line-height:1}
  .pcard .lbl{color:#ededed;font-size:34px;font-weight:600;margin-top:18px;line-height:1.3}

  footer{position:absolute;bottom:64px;left:150px;right:150px;display:flex;justify-content:space-between;align-items:center;z-index:2}
  .brand{color:var(--gold);font-size:24px;font-weight:600;letter-spacing:6px;text-transform:uppercase}
  .pageno{color:#5a5a5a;font-size:24px;font-weight:600}
</style>
</head>
<body>
<div id="root"></div>
<script>
const S = [
  {k:"On recrute", sm:true, t:`Actuellement, nous recherchons des <span class="g">setters</span> et des <span class="v">closers</span> <span style="color:#9a9a9a;font-weight:600">(homme / femme)</span> pour notre institut d'arabe coranique.`, sub:`Je t'invite à bien regarder cette vidéo en entier pour comprendre ce qu'on recherche — et ce qu'on ne recherche pas.`},
  {k:"Qui suis-je", t:`Moi, c'est <span class="g">Thomas</span>.`, bullets:[`Professeur d'arabe depuis plus de <b>4 ans</b>`,`Formé par <b>Nouman Ali Khan</b>, l'un des profs d'arabe les plus connus au monde`]},
  {k:"Mon parcours", t:`J'avais tout essayé pour <span class="g">apprendre l'arabe</span>…`, sub:`Rien n'avait fonctionné, jusqu'à ce que je découvre cette méthode. J'ai donc vécu exactement ce que vivent les élèves qu'on accompagne — je connais leurs blocages et ce dont ils ont besoin.`},
  {k:"L'institut", center:true, sm:true, t:`L'objectif de notre institut est de devenir <span class="g">la référence numéro 1</span> de l'apprentissage de l'arabe.`},
  {t:`Et pour ça,<br>on a besoin <span class="g">de toi.</span>`, center:true},
  {k:"Qui on aide ?", t:`Des <span class="g">frères et sœurs francophones</span>,<br>principalement entre 25 et 50 ans.`, sub:`Leur objectif : atteindre une compréhension totale de l'arabe coranique en <b style="color:#C9A97E">10 mois</b>.`},
  {k:"Nos 2 programmes", t:`Deux programmes <span class="g">high-ticket</span>`, pair:[{num:"9 mois",lbl:"Pour ceux qui savent déjà lire l'arabe"},{num:"10 mois",lbl:"Pour ceux qui ne savent pas encore lire"}]},
  {k:"L'accompagnement", t:`Un suivi <span class="g">complet</span>`, bullets:[`Cours individuels avec un <b>professeur attitré</b>`,`Une <b>plateforme vidéo</b>`,`Des <b>manuels</b> pour le travail personnel`]},
  {k:"D'où viennent nos prospects ?", t:`Un tunnel VSL <span class="g">qui performe</span>.`, sub:`Avec, en plus, une présence organique.`},
  {sm:true, t:`Pour la présence organique, l'institut compte :`, pair:[{num:"12K",lbl:"Instagram"},{num:"27K",lbl:"Facebook"},{num:"3K",lbl:"YouTube"}]},
  {k:"Ce qu'on vend vraiment", sm:true, t:`Pas de simples cours de langue, mais une réelle <span class="v">transformation spirituelle</span>.`, sub:`Car à la fin de notre programme, nos élèves pourront enfin comprendre le Coran et les prières, pour se rapprocher d'Allah, et transmettre potentiellement cet apprentissage à leurs enfants. Plusieurs témoignages sont disponibles sur ma chaîne YouTube témoignages.`},
  {k:"Le rôle du setter", t:`Tu ne prends pas<br>que des rendez-vous.`, sub:`Tu <span style="color:#C9A97E">qualifies</span> et tu <span style="color:#C9A97E">éduques</span>. Tu es la première voix de l'institut.`},
  {k:"Setter — tes missions", t:`Ce qu'on attend de toi`, bullets:[`<b>Une réactivité immédiate</b> : recontacter par téléphone un lead qui a laissé ses informations, en moins de 5 min`,`<b>Une qualification fine</b> : repérer les vrais projets, pas les curieux`,`<b>Des RDV de qualité</b> : prospects pré-vendus, et un taux de show-up <span class="v">supérieur à 80 %</span>`]},
  {k:"Le rôle du closer", t:`On ne cherche pas<br><span class="g">n'importe qui.</span>`, center:true},
  {k:"Closer — ce qu'on recherche", bullets:[`<b>Expérience</b> en closing (B2C idéalement, pas obligatoire)`,`<b>Sensibilité spirituelle</b> : comprendre l'impact de ce qu'on vend`,`<b>Ambition</b> : grandir avec nous, sur le long terme`,`<b>Autonomie</b> : gérer ton temps et tes résultats`,`<b>Bienveillance</b> : rassurer des élèves qui ont souvent connu l'échec`]},
  {k:"Ce qu'on t'offre", bullets:[`Une <b>formation complète</b> à notre méthode et notre script`,`Des <b>leads qualifiés</b> en quantité via le tunnel VSL`,`Des <b>outils et process rodés</b> (CRM, scripts…)`,`Une <b>évolution rapide</b> selon ta performance`]},
  {k:"Rémunération — Setter", t:`<span class="g">Setter</span>`, bullets:[`<b>4 %</b> sur le no-booking · <b>8 %</b> sur le self-booking <span style="color:#B9B9B9;font-weight:400">(sur le cash collecté)</span>`,`<b>Bonus de performance</b> : speed-to-lead & taux de show-up`]},
  {k:"Rémunération — Closer", t:`<span class="g">Closer</span>`, bullets:[`<b>10 %</b> du cash collecté`,`<b>Bonus de performance</b> : PIF & montant total collecté`]},
  {k:"Prochaine étape", t:`Remplis le formulaire<br>sous la vidéo.`, bullets:[`On étudiera ta candidature sous <b>48 h</b>`,`Si ton profil nous intéresse, tu auras un entretien avec mon associé`,`Une phase de test (role-plays)`,`Et si tout est bon → <span class="v">onboarding dans l'équipe</span>`]},
  {t:`Prêt à <span class="g">transformer des vies</span><br>avec nous ?`, sub:`Postule juste en dessous 👇`, center:true},
];

function render(i){
  const s = S[i];
  let h = `<div class="slide show${s.center?' center':''}${s.sm?' sm':''}">`;
  if(s.k) h += `<div class="kicker">${s.k}</div>`;
  if(s.t) h += `<h1>${s.t}</h1>`;
  if(s.sub) h += `<div class="sub">${s.sub}</div>`;
  if(s.bullets){h+=`<ul>`;s.bullets.forEach(b=>h+=`<li><span class="dot"></span><span>${b}</span></li>`);h+=`</ul>`;}
  if(s.pair){h+=`<div class="pair">`;s.pair.forEach(p=>h+=`<div class="pcard"><div class="num">${p.num}</div><div class="lbl">${p.lbl}</div></div>`);h+=`</div>`;}
  h += `<footer><div class="brand">À la lumière du Coran</div><div class="pageno">${String(i+1).padStart(2,'0')} / ${String(S.length).padStart(2,'0')}</div></footer>`;
  h += `</div>`;
  document.getElementById('root').innerHTML = h;
}
function fit(){
  const s=Math.min(window.innerWidth/1920, window.innerHeight/1080);
  document.getElementById('root').style.transform=`scale(${s})`;
}
const params = new URLSearchParams(location.search);
let idx = parseInt(params.get('s')||'0',10); if(isNaN(idx)||idx<0)idx=0; if(idx>=S.length)idx=S.length-1;
function go(n){ idx=Math.max(0,Math.min(S.length-1,n)); render(idx); fit(); }
go(idx);
window.addEventListener('resize',fit);
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key===' ')go(idx+1);if(e.key==='ArrowLeft')go(idx-1);});
// navigation tactile / clic : moitié droite = suivant, moitié gauche = précédent
document.addEventListener('click',e=>{ go(e.clientX < window.innerWidth/2 ? idx-1 : idx+1); });
window.__SLIDE_COUNT__ = S.length;
</script>
</body>
</html>
